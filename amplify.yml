version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        # Aprobar sharp automáticamente (alternativa a .npmrc)
        - echo "only-built-dependencies=sharp" >> .npmrc
    build:
      commands:
        - pnpm install --frozen-lockfile --ignore-scripts=false
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
